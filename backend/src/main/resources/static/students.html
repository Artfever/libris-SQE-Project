<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — Libris</title><link rel="icon" type="image/svg+xml" href="/assets/brand/libris-mark.svg" sizes="any"><link rel="icon" type="image/png" href="/assets/brand/libris-mark.png" sizes="512x512">
  <link rel="stylesheet" href="/css/first-paint.css"><script src="/js/first-paint-theme.js"></script>


  <link rel="stylesheet" href="/styles.css">

</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a><nav class="rail" id="rail"></nav>
  <main class="canvas" id="main-content"><div class="shell-page"><div id="topbar-root"></div>
    <header class="page-head"><p class="eyebrow">Members</p><div class="page-title-row"><div><h1 class="serif">Students</h1><p class="page-sub">Find and manage student accounts in the live library directory.</p></div><button class="btn-primary" id="addStudentBtn" type="button" hidden>Add student</button></div></header>
    <div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="sr-only">Search students</span><input type="search" placeholder="Search by name, email, or username"></label></div>
    <section class="collection-panel" aria-label="Student directory">
      <div class="table-container">
        <table class="data-table" id="studentsTable">
          <thead>
            <tr>
              <th>Student</th>
              <th>Username</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody class="people-grid" aria-live="polite">
            <tr><td colspan="6"><div class="loading-state">Loading students…</div></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div></main>
  <div id="palette-root"></div><div id="modal-root"></div><script type="module" src="/js/app-init.js"></script><script type="module" src="/js/students.js"></script>
</body>
</html>
