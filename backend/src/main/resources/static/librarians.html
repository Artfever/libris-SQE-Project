<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library team — Libris</title><link rel="icon" type="image/svg+xml" href="/assets/brand/libris-mark.svg" sizes="any"><link rel="icon" type="image/png" href="/assets/brand/libris-mark.png" sizes="512x512">
  <link rel="stylesheet" href="/css/first-paint.css"><script src="/js/first-paint-theme.js"></script>


  <link rel="stylesheet" href="/styles.css">

</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a><nav class="rail" id="rail"></nav>
  <main class="canvas" id="main-content"><div class="shell-page"><div id="topbar-root"></div>
    <header class="page-head"><p class="eyebrow">Team</p><div class="page-title-row"><div><h1 class="serif">Librarians</h1><p class="page-sub">Manage the staff accounts that run the library.</p></div><button class="btn-primary" id="addLibrarianBtn" type="button" hidden>Add librarian</button></div></header>
    <div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="sr-only">Search librarians</span><input type="search" placeholder="Search by name or username"></label></div>
    <section class="collection-panel" aria-label="Librarian directory">
      <div class="table-container">
        <table class="data-table" id="librariansTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Username</th>
              <th>Role</th>
              <th>Age</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody><tr><td colspan="6" class="table-state">Loading librarians…</td></tr></tbody>
        </table>
      </div>
      <div class="table-foot"><span class="muted">Loading results…</span><div class="pager"></div></div>
    </section>
  </div></main>
  <div id="palette-root"></div><div id="modal-root"></div><script type="module" src="/js/app-init.js"></script><script type="module" src="/js/librarians.js"></script>
</body>
</html>
