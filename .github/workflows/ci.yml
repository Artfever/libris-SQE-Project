name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Check formatting
        run: mvn spotless:check
        working-directory: backend

      - name: Build and test
        run: mvn clean verify
        working-directory: backend

  sonarqube:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # An ephemeral local server makes the analysis runnable on every PR,
      # including forks, without a long-lived token or external SonarQube host.
      - name: Start SonarQube Community Build
        run: |
          sudo sysctl -w vm.max_map_count=524288
          docker run -d --name sqe-sonarqube \
            --publish 127.0.0.1:9000:9000 \
            --env SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:26.11.0.134175-community
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:9000/api/system/status \
              | jq --exit-status '.status == "UP"' > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 100 sqe-sonarqube
          exit 1

      - name: Create ephemeral analysis token
        run: |
          token=$(curl --fail --silent --show-error \
            --user admin:admin \
            --data-urlencode "name=ci-${GITHUB_RUN_ID}" \
            http://127.0.0.1:9000/api/user_tokens/generate | jq -r '.token')
          test -n "$token" && test "$token" != null
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Analyze Java and enforce SonarQube quality gate
        working-directory: backend
        env:
          SONAR_HOST_URL: http://127.0.0.1:9000
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey=libris-sqe \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Stop ephemeral SonarQube
        if: always()
        run: docker rm -f sqe-sonarqube || true

  javascript:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Both suites are stdlib-only Node test-runner scripts (no package.json
      # and no dependencies), so no install step is needed. Each runs as its
      # own step, so a failure in either one fails the job and therefore CI.
      - name: Run registration JavaScript tests
        run: node --test backend/src/test/js/registration-errors.test.mjs

      - name: Run catalog importer tests
        run: node --test scripts/catalog-seed/*.test.mjs

  phase5:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependency install: the Phase 5 suites are stdlib-only and import
      # scripts/dev-seed/phase5_forecasting.py directly, so this job needs
      # neither a database nor any third-party package.
      - name: Run Phase 5 demand forecasting tests
        run: python -m unittest discover -s scripts/dev-seed -p "test_phase5*.py"

  backup-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The backup script parses .env rather than sourcing it, because Compose
      # env-file syntax is not shell syntax. These tests stub `docker`, so they
      # need neither a database nor any dependency, and they assert that no
      # credential reaches a command line.
      - name: Run backup script regression tests
        run: sh scripts/backup-mysql.test.sh

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Dual-architecture build gate. Prior operator reports describe the OCI
      # production host as x86_64 (linux/amd64); the linux/arm64 build is kept
      # as a portability regression check so the image does not silently become
      # architecture-specific. QEMU supplies the emulator the runner needs to
      # execute the ARM64 build stage on this x86_64 host.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # The default `docker` driver rejects multi-platform builds outright
      # ("Multi-platform build is not supported for the docker driver"), so a
      # buildx builder is required rather than optional.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the root Dockerfile for both architecture targets. This is a
      # regression gate, not a release path: `push: false` and the cacheonly
      # exporter mean no image is published anywhere, and nothing is deployed.
      # It catches a broken Dockerfile, a base-image tag that stops resolving
      # for an architecture, and any future dependency that pulls in a
      # platform-specific native library.
      - name: Build for linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          # The ARM64 Maven stage runs under emulation, which is the slowest
          # part of this job. The Actions cache keeps the dependency and
          # build layers warm so the cost is paid on the first run only.
          cache-from: type=gha
          cache-to: type=gha,mode=max
